<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Titsa'a Ndipowa" />
    <meta
      name="description"
      content="this is a sample portfolio project from TripleTen Coding Bootcamp - Sprint 1"
    />
    <meta
      name="keywords"
      content="flashcards, study aids, learning materials"
    />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&amp;display=swap"
      rel="stylesheet"
    />
    <title>Portfolio Project</title>
  </head>
  <body class="page">
    <header class="header">
      <nav class="nav">
        <h1 class="header__title">
          <a class="header__link" href="#">Flash Cards</a>
        </h1>
        <ul class="nav__links">
          <li class="nav__link"><a href="#home">My Decks</a></li>
          <li class="nav__link"><a href="#about">About</a></li>
        </ul>
      </nav>
    </header>

    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="deck-template">
              <li class="card">
                <a class="card__link" href="#"></a>
                <h3 class="card__title">Deck title</h3>
                <div class="card__row">
                  <p class="card__count">0 cards</p>
                  <button
                    type="button"
                    class="card__btn card__btn_type_delete"
                    aria-label="Delete this deck"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button
            type="button"
            class="gallery__new-card-btn"
            aria-label="Add new deck"
          >
            + New Deck
          </button>
        </div>
      </section>
      <section class="new-deck-view" id="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Choose a color</legend>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_green"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#64d583"
                checked
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_blue"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#91a8f9"
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_pink"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#ee92d7"
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_purple"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#aa8ef0"
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_orange"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#ee955e"
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
            <label
              class="new-deck-view__color-option new-deck-view__color-option_color_yellow"
            >
              <input
                class="new-deck-view__color-input"
                type="radio"
                name="color"
                value="#f5d770"
              />
              <span class="new-deck-view__color-swatch"></span>
            </label>
          </fieldset>
          <label class="new-deck-view__json-label" for="new-deck-json">
            Deck JSON
            <textarea
              class="new-deck-view__textarea"
              id="new-deck-json"
              name="deck-json"
              placeholder="Paste deck JSON here"
            ></textarea>
          </label>
          <button class="new-deck-view__submit-btn" type="submit" disabled>
            Create Deck
          </button>
        </form>
      </section>
      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title">Deck</h2>
          <button
            type="button"
            class="gallery__practice-btn"
            aria-label="Practice"
          >
            Practice
          </button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="flashcard-template">
              <li class="card">
                <h3 class="card__title">Flashcard question</h3>
                <div class="card__row">
                  <button
                    type="button"
                    class="card__btn card__btn_type_flip"
                    aria-label="Flip flashcard"
                  ></button>
                  <button
                    type="button"
                    class="card__btn card__btn_type_delete"
                    aria-label="Delete flashcard"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
          <button
            type="button"
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
            aria-label="Add new card"
          >
            + New Card
          </button>
        </div>
      </section>
      <section id="not-found" class="not-found">
        <h2 class="not-found__title">404 Not Found</h2>
        <p class="not-found__text">
          The page you are looking for does not exist.
        </p>
      </section>
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">Flashcard practice</h2>
        <div class="carousel__grid">
          <button
            type="button"
            aria-label="Go to previous card in deck"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
          ></button>
          <div class="carousel__card">
            <p class="carousel__card-text">Flashcard question</p>
          </div>
          <button
            type="button"
            aria-label="Go to next card in deck"
            class="carousel__btn carousel__btn_type_right"
          ></button>
          <button
            type="button"
            aria-label="Flip card"
            class="carousel__btn carousel__btn_type_flip"
          ></button>
        </div>
      </section>
    </main>

    <div class="modal">
      <div class="modal__overlay"></div>
      <div class="modal__content">
        <h2 class="modal__title">Confirm action</h2>
        <p class="modal__text">Are you sure?</p>
        <div class="modal__buttons">
          <button type="button" class="modal__cancel-btn">Cancel</button>
          <button type="button" class="modal__confirm-btn">Confirm</button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p class="footer__text">designed with love &copy; 2026</p>
    </footer>

    <script src="./assets/js/index.js" type="module"></script>
  </body>
</html>
